openapi: 3.2.0
info:
  title: CEX.IO Spot Trading Private REST Funding API
  version: '2026-10-13'
  description: Private (API-key signed) REST calls of the CEX.IO Spot Trading API. Limited per API key to 200 points per minute; 429 on exhaustion (per docs).
  contact:
    url: https://support.cex.io/en/
  termsOfService: https://cex.io/terms
servers:
- url: https://trade.cex.io/api/spot/rest
security:
- XAggrKey: []
  XAggrTimestamp: []
  XAggrSignature: []
tags:
- name: Funding
paths:
