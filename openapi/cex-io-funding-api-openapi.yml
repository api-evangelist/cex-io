components:
  securitySchemes:
    XAggrKey:
      type: apiKey
      in: header
      name: X-AGGR-KEY
    XAggrTimestamp:
      type: apiKey
      in: header
      name: X-AGGR-TIMESTAMP
    XAggrSignature:
      type: apiKey
      in: header
      name: X-AGGR-SIGNATURE
      description: base64 HMAC-SHA256 of action + timestamp + JSON body, keyed with the API secret (per docs example).
externalDocs:
