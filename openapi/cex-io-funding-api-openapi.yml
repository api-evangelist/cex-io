    post:
      operationId: do_my_internal_transfer
      summary: Internal Transfer
      tags:
      - Funding
      x-source: https://trade.cex.io/docs/
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '429':
          description: API rate limit exceeded
      requestBody:
        required: false
        content:
          application/json:
            schema:
